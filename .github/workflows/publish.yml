name: Publish Multi-Target NuGet Package

on:
  push:
    tags:
      - 'v*'        # Trigger on tags like v1.1.0

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # latest SDK for multi-target
          dotnet-quality: 'preview'

      # 3. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ./ZarinPal-SDK/ZarinPal-SDK.csproj

      # 4. Build all target frameworks
      - name: Build
        run: dotnet build ./ZarinPal-SDK/ZarinPal-SDK.csproj --configuration Release --no-restore

      # 5. Pack all target frameworks
      - name: Pack NuGet package
        run: |
          dotnet pack ./ZarinPal-SDK/ZarinPal-SDK.csproj \
            --configuration Release \
            --output ./artifacts \
            --no-build \
            -p:IncludeSymbols=true \
            -p:IncludeSource=true

      # 6. NuGet login via OIDC (Trusted Publishing)
      - name: NuGet login
        uses: NuGet/login@v1
        with:
          user: Exhsn

      # 7. Push package to NuGet.org
      - name: Push NuGet package
        run: |
          for nupkg in ./artifacts/*.nupkg; do
            echo "Pushing $nupkg"
            dotnet nuget push "$nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
