name: Build & Test CI

on:
  push:
    branches: [ main, master, 'feature/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore ZarinPal-SDK.slnx

      - name: Build solution
        run: dotnet build ZarinPal-SDK.slnx --configuration Release --no-restore

      - name: Run test suite
        run: dotnet test ZarinPal-SDK.slnx --configuration Release --no-build --verbosity normal
