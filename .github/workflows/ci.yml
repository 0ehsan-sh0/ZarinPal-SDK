name: Build & Test CI

on:
  push:
    branches: [ main, master, 'feature/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore ./ZarinPal-SDK/ZarinPal-SDK.csproj
          dotnet restore ./tests/ZarinPal.SDK.UnitTests/ZarinPal.SDK.UnitTests.csproj
          dotnet restore ./tests/ZarinPal.SDK.IntegrationTests/ZarinPal.SDK.IntegrationTests.csproj
          dotnet restore ./tests/ZarinPal.SDK.E2ETests/ZarinPal.SDK.E2ETests.csproj

      - name: Build projects
        run: |
          dotnet build ./ZarinPal-SDK/ZarinPal-SDK.csproj --configuration Release --no-restore
          dotnet build ./tests/ZarinPal.SDK.UnitTests/ZarinPal.SDK.UnitTests.csproj --configuration Release --no-restore
          dotnet build ./tests/ZarinPal.SDK.IntegrationTests/ZarinPal.SDK.IntegrationTests.csproj --configuration Release --no-restore
          dotnet build ./tests/ZarinPal.SDK.E2ETests/ZarinPal.SDK.E2ETests.csproj --configuration Release --no-restore

      - name: Run test suite
        run: |
          dotnet test ./tests/ZarinPal.SDK.UnitTests/ZarinPal.SDK.UnitTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test ./tests/ZarinPal.SDK.IntegrationTests/ZarinPal.SDK.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test ./tests/ZarinPal.SDK.E2ETests/ZarinPal.SDK.E2ETests.csproj --configuration Release --no-build --verbosity normal
